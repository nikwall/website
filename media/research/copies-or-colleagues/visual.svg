<svg xmlns="http://www.w3.org/2000/svg" class="vis" viewBox="0 0 1000 400" role="img" aria-label="AI models err alike, people win when they are organized: members of the public share 70 percent of their forecast error, AI models 86 percent, and the best tool-using system shares 93 percent with the best plain model." font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="400" fill="#f1f5f0"/>
  <text x="48" y="104" font-size="46" font-weight="300" fill="#135b49">AI models err alike.</text>
  <text x="48" y="158" font-size="46" font-weight="300" fill="#135b49">People win when</text>
  <text x="48" y="212" font-size="46" font-weight="300" fill="#135b49">they are organized.</text>
  <text x="48" y="261" font-size="19" font-weight="300" fill="#2f3639">Share of each forecaster's error that the</text>
  <text x="48" y="288" font-size="19" font-weight="300" fill="#2f3639">others make too: people 70%, AI models 86%,</text>
  <text x="48" y="315" font-size="19" font-weight="300" fill="#2f3639">best tool-using system and best model 93%.</text>

  <polygon points="505,205 905,30 905,380" fill="#9dc09f" opacity="0.16"/>
  <g fill="none" stroke="#9dc09f" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.5 11">
    <path d="M505,205 C640,205 720,62 868,62"/>
    <path d="M505,205 C640,205 720,132 868,132"/>
    <path d="M505,205 C640,205 720,278 868,278"/>
    <path d="M505,205 C640,205 720,348 868,348"/>
  </g>
  <g fill="#9dc09f">
    <circle cx="882" cy="62" r="13"/><circle cx="882" cy="132" r="13"/>
    <circle cx="882" cy="278" r="13"/><circle cx="882" cy="348" r="13"/>
  </g>
  <g fill="none" stroke="#bb2649" stroke-width="2.6" stroke-linecap="round">
    <path d="M505,205 C640,205 720,191 870,191"/>
    <path d="M505,205 C640,205 720,198 870,198"/>
    <path d="M505,205 C640,205 720,205 870,205"/>
    <path d="M505,205 C640,205 720,212 870,212"/>
    <path d="M505,205 C640,205 720,219 870,219"/>
  </g>
  <g fill="#bb2649">
    <circle cx="872" cy="191" r="4.5"/><circle cx="872" cy="198" r="4.5"/><circle cx="872" cy="205" r="4.5"/>
    <circle cx="872" cy="212" r="4.5"/><circle cx="872" cy="219" r="4.5"/>
  </g>
  <circle cx="505" cy="205" r="12" fill="#135b49"/><circle cx="505" cy="205" r="4.5" fill="#f1f5f0"/>
  <text x="982" y="28" font-size="15" font-weight="500" fill="#5b6366" letter-spacing="1.5" text-anchor="end">PEOPLE · 70% SHARED</text>
  <text x="982" y="178" font-size="15" font-weight="500" fill="#bb2649" letter-spacing="1.5" text-anchor="end">AI · 86–93%</text>
</svg>
