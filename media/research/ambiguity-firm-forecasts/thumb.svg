<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" font-family="Roboto, Segoe UI, sans-serif">
  <!-- Card thumbnail: one forecast before the shock, three reactions after it -->
  <defs>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#d79ba5" stroke-width="3.5"/>
    </pattern>
  </defs>
  <rect width="500" height="200" fill="#f1f5f0"/>
  <rect x="230" y="22" width="80" height="20" rx="4" fill="none" stroke="#9ba0a5" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="215" y="37" text-anchor="end" font-size="13" fill="#5b6366">before</text>
  <rect x="150" y="62" width="80" height="20" rx="4" fill="#135b49"/>
  <text x="135" y="77" text-anchor="end" font-size="13" fill="#5b6366">pessimism</text>
  <rect x="190" y="102" width="170" height="20" rx="4" fill="#9dc09f"/>
  <text x="175" y="117" text-anchor="end" font-size="13" fill="#5b6366">risk</text>
  <rect x="230" y="142" width="80" height="20" rx="4" fill="#135b49"/>
  <rect x="318" y="142" width="96" height="20" rx="4" fill="url(#h)" stroke="#bb2649" stroke-width="2"/>
  <text x="215" y="157" text-anchor="end" font-size="13" fill="#bb2649" font-weight="500">ambiguity</text>
  <line x1="60" y1="182" x2="460" y2="182" stroke="#9ba0a5" stroke-width="1.5"/>
</svg>
