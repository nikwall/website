  <text x="48" y="212" font-size="46" font-weight="300" fill="#135b49">in town halls.</text>
  <text x="48" y="261" font-size="19" font-weight="300" fill="#2f3639">Most German municipalities use little</text>
  <text x="48" y="288" font-size="19" font-weight="300" fill="#2f3639">structured management, though those</text>
  <text x="48" y="315" font-size="19" font-weight="300" fill="#2f3639">that use more are more attractive.</text>
  <text x="48" y="352" font-size="15" font-weight="300" fill="#5b6366">Schematic, not data.</text>

