<svg xmlns="http://www.w3.org/2000/svg" class="vis" viewBox="0 0 1000 400" role="img" aria-label="Four essays on how organizations work: honesty in groups, managers, performance feedback and whistleblower protection, all published." font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="400" fill="#f1f5f0"/>
  <text x="48" y="104" font-size="46" font-weight="300" fill="#135b49">Four essays on</text>
  <text x="48" y="158" font-size="46" font-weight="300" fill="#135b49">how organizations</text>
  <text x="48" y="212" font-size="46" font-weight="300" fill="#135b49">work.</text>
  <text x="48" y="261" font-size="19" font-weight="300" fill="#2f3639">Honesty, managers, feedback and</text>
  <text x="48" y="288" font-size="19" font-weight="300" fill="#2f3639">whistleblowing, from football data and</text>
  <text x="48" y="315" font-size="19" font-weight="300" fill="#2f3639">lab experiments. All four are published.</text>
  <rect x="470" y="60" width="230" height="132" rx="8" fill="#ffffff" stroke="#9dc09f" stroke-width="1.5"/><text x="488" y="90" font-size="13" font-weight="500" fill="#135b49" letter-spacing="1.2">HONESTY · 2015</text><text x="488" y="122" font-size="19" font-weight="300" fill="#2f3639">In groups, gender</text><text x="488" y="146" font-size="19" font-weight="300" fill="#2f3639">matters.</text><text x="488" y="174" font-size="13" font-weight="300" fill="#5b6366">Economics Letters</text><rect x="716" y="60" width="230" height="132" rx="8" fill="#ffffff" stroke="#9dc09f" stroke-width="1.5"/><text x="734" y="90" font-size="13" font-weight="500" fill="#135b49" letter-spacing="1.2">MANAGERS · 2018</text><text x="734" y="122" font-size="19" font-weight="300" fill="#2f3639">Same team, better</text><text x="734" y="146" font-size="19" font-weight="300" fill="#2f3639">manager, more points.</text><text x="734" y="174" font-size="13" font-weight="300" fill="#5b6366">Journal of Sports Economics</text><rect x="470" y="206" width="230" height="132" rx="8" fill="#ffffff" stroke="#9dc09f" stroke-width="1.5"/><text x="488" y="236" font-size="13" font-weight="500" fill="#135b49" letter-spacing="1.2">FEEDBACK · 2021</text><text x="488" y="268" font-size="19" font-weight="300" fill="#2f3639">One benchmark does</text><text x="488" y="292" font-size="19" font-weight="300" fill="#2f3639">not fit all.</text><text x="488" y="320" font-size="13" font-weight="300" fill="#5b6366">JITE</text><rect x="716" y="206" width="230" height="132" rx="8" fill="#ffffff" stroke="#9dc09f" stroke-width="1.5"/><text x="734" y="236" font-size="13" font-weight="500" fill="#135b49" letter-spacing="1.2">WHISTLEBLOWING · 2025</text><text x="734" y="268" font-size="19" font-weight="300" fill="#2f3639">Protection has</text><text x="734" y="292" font-size="19" font-weight="300" fill="#2f3639">a hidden cost.</text><text x="734" y="320" font-size="13" font-weight="300" fill="#5b6366">Review of Law &amp; Economics</text>
  <text x="470" y="370" font-size="15" font-weight="300" fill="#5b6366">PhD thesis, University of Hamburg, 2019.</text>
